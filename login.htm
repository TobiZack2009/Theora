<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEORA - AI Financial Copilot</title>
    <!-- External Libraries -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Embedded CSS with THEORA Brand Colors -->
    <style>
        :root {
            /* THEORA Brand Color Scheme (Base) */
            --primary-blue: #00bcd4;
            --gradient-start: #00e0ff;
            --gradient-end: #00bfa6;
            --success: #4caf50;
            --warning: #ffc107;
            --error: #f44336;

            /* Gradients */
            --gradient-text: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));

            /* Light Theme (Default) */
            --bg-primary: #f0f7fa;
            --bg-secondary: #ffffff;
            --text-primary: #00111E;
            --text-secondary: #5A6B7B;
            --border-color: #dbe9f0;
            --btn-close-filter: none;
        }

        [data-theme="dark"] {
            --bg-primary: #00111E;
            --bg-secondary: #021B34;
            --text-primary: #f5faff;
            --text-secondary: rgba(245, 250, 255, 0.7);
            --border-color: rgba(0, 188, 212, 0.2);
            --btn-close-filter: invert(1) grayscale(100) brightness(200%) opacity(0.7);
        }


        /* --- Global Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- Auth Page (Login/Sign Up) --- */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--bg-secondary);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 224, 255, 0.1);
            max-width: 420px;
            width: 100%;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo i {
            font-size: 60px;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 10px;
        }

        .auth-logo p {
            color: var(--text-secondary); /* Changed to secondary for less clash */
            font-size: 14px;
            /* Height is needed to prevent layout shift */
            height: 1.5em; 
        }

        /* New Auth Buttons */
        .btn-social {
            color: var(--text-primary);
            border-color: var(--border-color);
            background: var(--bg-secondary);
            padding: 10px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-social:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--primary-blue);
        }
        .btn-social i.fa-university {
            color: var(--primary-blue);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        .auth-divider hr {
            flex-grow: 1;
            border-color: var(--border-color);
            transition: border-color 0.3s;
        }
        .auth-divider span {
            margin: 0 1rem;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Form Styling */
        .form-label {
            color: var(--text-primary);
            opacity: 0.9;
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .form-control:focus {
            background-color: var(--bg-secondary);
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.2);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .form-check-input {
            background-color: var(--bg-primary);
            border-color: var(--border-color);
        }
        .form-check-input:checked {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
        }
        .form-check-label {
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--gradient-text);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            color: var(--dark-navy);
            transition: all 0.3s;
        }

        .btn-primary:hover {
            color: var(--dark-navy);
            box-shadow: 0 5px 20px rgba(0, 224, 255, 0.3);
            transform: translateY(-2px);
        }
        
        /* Auth Toggle Link */
        #authToggle {
            color: var(--text-secondary);
            font-size: 14px;
        }
        #authToggle a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }
        #authToggle a:hover {
            text-decoration: underline;
        }
        
        /* --- Notification Toast --- */
        .notification-toast {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 350px;
            z-index: 9999;
            animation: slideInRight 0.5s ease-out;
            display: none;
            border: 1px solid var(--border-color);
        }

        @keyframes slideInRight {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .notification-content h6 {
            margin: 0;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        .notification-content p {
            margin: 5px 0 0 0;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .notification-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-secondary);
            opacity: 0.5;
            cursor: pointer;
            font-size: 18px;
        }
        .notification-close:hover {
            opacity: 1;
        }

        /* --- Typing Effect Styles --- */
        .typing-effect {
            /* This gradient matches your brand */
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700; /* Make the typed word stand out */
            padding-right: 2px;
            /* The cursor */
            border-right: 3px solid var(--primary-blue);
            animation: blink-caret 0.75s step-end infinite;
        }

        /* Blinking cursor animation */
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--primary-blue); }
        }


        /* Responsive */
        @media (max-width: 768px) {
            .auth-card {
                padding: 30px 20px;
            }

            .notification-toast {
                right: 10px;
                left: 10px;
                max-width: calc(100% - 20px);
            }
        }
    </style>
</head>
<body>

    <!-- =================================== -->
    <!--  Auth Page (Login / Sign Up)        -->
    <!-- =================================== -->
    <div id="authPage" class="auth-container" style="display: flex;">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-atom"></i>
                <h1>THEORA</h1>
                <!-- UPDATED HTML FOR TYPING EFFECT -->
                <p id="authTitle">
                    Your AI <span class="typing-effect"></span>
                </p>
            </div>

            <!-- New Social/Bank Sign in Buttons -->
            <button class="btn btn-social w-100 mb-2" onclick="showFeatureComingSoon(event)">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" style="margin-top: -2px;">
                    <path d="M17.64 9.20455C17.64 8.56818 17.5818 7.95 17.4705 7.36364H9V10.8409H13.8436C13.6364 11.9727 13.0091 12.9318 12.0682 13.5682V15.8182H14.9564C16.6773 14.25 17.64 11.9318 17.64 9.20455Z" fill="#4285F4"/>
                    <path d="M9 18C11.4318 18 13.4773 17.1818 14.9564 15.8182L12.0682 13.5682C11.2318 14.1273 10.2182 14.4545 9 14.4545C6.96364 14.4545 5.25 13.0682 4.63636 11.25H1.70455V13.5955C3.18182 16.3364 5.86364 18 9 18Z" fill="#34A853"/>
                    <path d="M4.63636 11.25C4.43182 10.6591 4.32273 10.0227 4.32273 9.36364C4.32273 8.70455 4.43182 8.06818 4.63636 7.47727V5.13182H1.70455C0.9 6.65909 0.45 8.31818 0.45 10C0.45 11.6818 0.9 13.3409 1.70455 14.8682L4.63636 11.25Z" fill="#FBBC05"/>
                    <path d="M9 3.54545C10.3091 3.54545 11.5 4.01364 12.45 4.90455L15.0136 2.34091C13.4773 0.886364 11.4318 0 9 0C5.86364 0 3.18182 1.66364 1.70455 4.40455L4.63636 6.75C5.25 4.93182 6.96364 3.54545 9 3.54545Z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>
            <button class="btn btn-social w-100 mb-3" onclick="showFeatureComingSoon(event)">
                <i class="fas fa-university"></i> Connect your Bank
            </button>
            
            <!-- Divider -->
            <div class="auth-divider">
                <hr />
                <span>Or with email</span>
                <hr />
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email or Phone</label>
                    <input type="text" class="form-control" placeholder="Enter your email or phone" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login to Dashboard</button>
            </form>
            
            <!-- Sign Up Form (Hidden by default) -->
            <form id="signupForm" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="e.g., Chioma Okeke" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="e.g., chioma@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Create a strong password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>

            <!-- Auth Toggle Link -->
            <p class="text-center mt-3 mb-0" id="authToggle">
                Don't have an account? <a href="#" onclick="toggleAuth(event, 'signup')">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Notification Toast (for "Coming Soon" messages) -->
    <div class="notification-toast" id="notificationToast">
        <button class="notification-close" onclick="closeNotification()">
            <i class="fas fa-times"></i>
        </button>
        <div class="notification-header">
            <div class="notification-icon" id="notifIcon">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <div class="notification-content">
                <h6 id="notifTitle">Assignment Deadline Approaching!</h6>
                <p id="notifMessage">Your Software Engineering assignment is due in 4 hours. Time to finish up! 💪</p>
            </div>
        </div>
    </div>


    <!-- =================================== -->
    <!--  Embedded JavaScript                -->
    <!-- =================================== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        /* --- Notifications Array (for demo toasts) --- */
        const notifications = [
            {
                title: "Feature Coming Soon!",
                message: "We are working hard to bring this feature to you.",
                icon: "info-circle",
                color: "var(--primary-blue)",
                bg: "rgba(0, 188, 212, 0.1)"
            },
            {
                title: "Login Successful!",
                message: "Redirecting to your dashboard...",
                icon: "check-circle",
                color: "var(--success)",
                bg: "rgba(76, 175, 80, 0.1)"
            }
        ];
        
        /* --- Page Navigation & Auth --- */
        
        // Get page elements
        const authPage = document.getElementById('authPage');
        
        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            loginToDashboard();
        });
        
        // Sign Up functionality
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // In a real app, you'd create the user here. For this demo, we just log in.
            loginToDashboard();
        });

        // Main login function
        function loginToDashboard() {
            // In this standalone file, we just show a success message
            showSuccessToast('Login Successful!', 'Redirecting to your dashboard...', 'success');
            console.log('Login successful. In full app, we would redirect here.');
            // In the full app, this is where you'd hide authPage and show dashboardPage
            // authPage.style.display = 'none';
            // dashboardPage.style.display = 'block';
        }

        // Toggle between Login and Sign Up forms
        function toggleAuth(e, mode) {
            if (e) e.preventDefault();
            
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const authToggle = document.getElementById('authToggle');
            const authTitle = document.getElementById('authTitle');
            
            // Find all dividers
            const dividers = document.querySelectorAll('.auth-divider');

            if (mode === 'signup') {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                // authTitle.textContent = 'Create Your THEORA Account'; // Handled by typing effect
                authToggle.innerHTML = 'Already have an account? <a href="#" onclick="toggleAuth(event, \'login\')">Log In</a>';
                // Hide dividers on sign up form
                dividers.forEach(d => d.style.display = 'none');

            } else {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                // authTitle.textContent = 'Your AI Financial Copilot'; // Handled by typing effect
                authToggle.innerHTML = 'Don\'t have an account? <a href="#" onclick="toggleAuth(event, \'signup\')">Sign Up</a>';
                // Show dividers on login form
                dividers.forEach(d => d.style.display = 'flex');
            }
        }

        /* --- UI Notifications & Tips --- */

        // Show Notification
        function showNotification(notif) {
            const toast = document.getElementById('notificationToast');
            const icon = document.getElementById('notifIcon');
            const title = document.getElementById('notifTitle');
            const message = document.getElementById('notifMessage');
        
            // Update notification content
            icon.style.background = notif.bg;
            icon.style.color = notif.color;
            icon.innerHTML = `<i class="fas fa-${notif.icon}"></i>`;
            title.textContent = notif.title;
            message.textContent = notif.message;
        
            // Show notification
            toast.style.display = 'block';
        
            // Auto-hide after 5 seconds
            setTimeout(() => {
                closeNotification();
            }, 5000);
        }

        // Close Notification
        function closeNotification() {
            const toast = document.getElementById('notificationToast');
            if (toast) {
                toast.style.display = 'none';
            }
        }
        
        // Re-usable function to show a success toast
        function showSuccessToast(title, message, type = 'success') {
            let notif;
            if (type === 'success') {
                notif = {
                    title: title,
                    message: message,
                    icon: "check-circle",
                    color: "var(--success)",
                    bg: "rgba(76, 175, 80, 0.1)"
                };
            } else if (type === 'info') {
                 notif = {
                    title: title,
                    message: message,
                    icon: "info-circle",
                    color: "var(--primary-blue)",
                    bg: "rgba(0, 188, 212, 0.1)"
                };
            }
            showNotification(notif);
        }

        // New function for "Coming Soon"
        function showFeatureComingSoon(e) {
            if(e) e.preventDefault();
            showSuccessToast('Feature Coming Soon!', 'We are working hard to bring this feature to you.', 'info');
        }


        /* --- Theme Toggle Logic (Initial Load) --- */
        (function() {
            const savedTheme = localStorage.getItem('theora-theme') || 'dark'; // Default to dark
            document.documentElement.dataset.theme = savedTheme;
        })();


        /* --- NEW: Typing Effect Logic --- */
        const wordsToType = ["Financial Copilot", "Productivity Hub", "Savings Tracker", "Task Manager"];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typeSpeed = 150;
        const deleteSpeed = 100;
        const pauseTime = 2000;
        let typeEffectTimer; // To hold the timeout ID

        function typeEffect() {
            // Get page elements
            const authPage = document.getElementById('authPage');
            if (!authPage) return; // Failsafe
            
            const typingSpan = authPage.querySelector(".typing-effect");

            // ONLY run if the auth page is visible and the span exists
            if (authPage.style.display !== 'none' && typingSpan) {
                const currentWord = wordsToType[wordIndex];

                if (isDeleting) {
                    // Deleting
                    typingSpan.textContent = currentWord.substring(0, charIndex - 1);
                    charIndex--;
                } else {
                    // Typing
                    typingSpan.textContent = currentWord.substring(0, charIndex + 1);
                    charIndex++;
                }

                if (!isDeleting && charIndex === currentWord.length) {
                    // Word is fully typed, pause
                    isDeleting = true;
                    typeEffectTimer = setTimeout(typeEffect, pauseTime);
                } else if (isDeleting && charIndex === 0) {
                    // Word is fully deleted
                    isDeleting = false;
                    wordIndex = (wordIndex + 1) % wordsToType.length; // Move to next word
                    typeEffectTimer = setTimeout(typeEffect, 500); // Short pause before typing
                } else {
                    // Continue typing/deleting
                    typeEffectTimer = setTimeout(typeEffect, isDeleting ? deleteSpeed : typeSpeed);
                }
            } else {
                // Page is not visible, clear the timer.
                clearTimeout(typeEffectTimer);
                // Re-check in 1 second to see if the page has become visible (e.g., after logout)
                typeEffectTimer = setTimeout(typeEffect, 1000);
            }
        }

        // Start the effect once the page loads
        document.addEventListener('DOMContentLoaded', () => {
            // A short delay to let the page render before starting
            typeEffectTimer = setTimeout(typeEffect, 1000);
        });

    </script>
</body>
</html>
